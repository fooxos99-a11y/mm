name: Focused public header check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-390, desktop-1440]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: composer install --working-dir=../backend --no-interaction --prefer-dist --no-progress --no-ansi
      - run: cp ../backend/.env.example ../backend/.env
      - run: php ../backend/artisan key:generate
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:dist -- --project=${{ matrix.project }} public-navigation.spec.mjs --grep='public headers keep'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: public-header-${{ matrix.project }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 3
