name: Deploy release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
      ref:
        description: Commit SHA or tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - run: composer install --working-dir=backend --no-interaction --prefer-dist --no-progress --no-ansi
      - run: cp backend/.env.example backend/.env && php backend/artisan key:generate
      # Pushes to main deploy after the fast gate (secrets, size, lint, unit, backend tests, build).
      # Manual runs keep the full release gate, including browser tests.
      - if: github.event_name == 'push'
        run: npm run verify:quick && npm test && npm run build && npm --prefix frontend run check:bundle
      - if: github.event_name != 'push'
        run: npm run verify:release
      - name: Package immutable release
        run: tar --exclude=release.tgz --exclude=.git --exclude='.*-logs' --exclude=frontend/node_modules --exclude=backend/vendor --exclude=backend/storage --exclude=backend/.env -czf "$RUNNER_TEMP/release.tgz" .
      - name: Configure SSH host verification
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and atomically activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          release_id="$(git rev-parse HEAD)"
          remote_archive="/tmp/momars-${release_id}.tgz"
          scp "$RUNNER_TEMP/release.tgz" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          scp scripts/deploy-release.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy-release.sh"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash /tmp/deploy-release.sh '$DEPLOY_ROOT' '$remote_archive' '$release_id'"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -f '$remote_archive' /tmp/deploy-release.sh"
      - name: Verify deployed environment
        env:
          STAGING_URL: ${{ secrets.DEPLOY_URL }}
          STAGING_CORS_ORIGIN: ${{ secrets.DEPLOY_CORS_ORIGIN }}
        run: npm run verify:staging
