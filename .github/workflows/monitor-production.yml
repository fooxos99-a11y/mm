name: Monitor production

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check availability, latency, errors and queue health
        env:
          MONITOR_URL: ${{ secrets.PRODUCTION_MONITOR_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          MONITOR_MAX_LATENCY_MS: '2000'
        run: node scripts/monitor-production.mjs
