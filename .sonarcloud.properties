# Used by SonarCloud Automatic Analysis (sonar-project.properties is used by CI scans).
sonar.sources=.
# Test code is analysed as tests (no security taint rules on test fixtures and helpers).
sonar.tests=frontend/e2e,frontend/node-tests,backend/tests,scripts/monitor-production.test.mjs,scripts/wait-for-commit-checks.test.mjs
# The SQL file is a data snapshot for local imports, not application source.
# Saved audit reports are generated evidence, not application HTML or source code.
sonar.exclusions=backend/database/momars-data.sql,reports/**,frontend/e2e/**,frontend/node-tests/**,backend/tests/**,scripts/*.test.mjs,**/node_modules/**,**/vendor/**
